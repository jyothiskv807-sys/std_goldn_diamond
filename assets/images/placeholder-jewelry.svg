<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A67C00" />
      <stop offset="50%" stop-color="#F1D77A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#cardBg)" />
  <circle cx="300" cy="270" r="160" fill="none" stroke="url(#goldG)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  
  <!-- Stylized Royal Necklace / Jewellery Silhouette -->
  <path d="M180,210 Q300,340 420,210" fill="none" stroke="url(#goldG)" stroke-width="4" stroke-linecap="round" />
  <path d="M200,240 Q300,360 400,240" fill="none" stroke="url(#goldG)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M220,270 Q300,380 380,270" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.6" />
  
  <!-- Center Pendant -->
  <polygon points="300,350 325,385 300,420 275,385" fill="url(#goldG)" />
  <circle cx="300" cy="385" r="8" fill="#FFF2B2" />

  <!-- Drops -->
  <circle cx="240" cy="315" r="5" fill="url(#goldG)" />
  <circle cx="270" cy="335" r="6" fill="url(#goldG)" />
  <circle cx="330" cy="335" r="6" fill="url(#goldG)" />
  <circle cx="360" cy="315" r="5" fill="url(#goldG)" />

  <text x="300" y="475" font-family="'Cormorant Garamond', serif" font-size="28" font-weight="600" fill="#F1D77A" text-anchor="middle" letter-spacing="4">STANDARD GOLD &amp; DIAMONDS</text>
  <text x="300" y="505" font-family="'Poppins', sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="middle" opacity="0.7" letter-spacing="2">PAYYAVOOR, KANNUR</text>
</svg>
